name: Build 12.0.0 PTT Production Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-release:
    name: Production release package and certification gate
    runs-on: ubuntu-latest
    timeout-minutes: 32

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Verify hardening baseline
        run: node scripts/test-security-performance-recovery-11.9.0.mjs

      - name: Verify production release scenarios
        run: node scripts/test-production-release-12.0.0.mjs

      - name: Generate production release certification lab
        run: node scripts/generate-production-release-workbench-12.0.0.mjs

      - name: Generate release candidate evidence
        run: node scripts/production-release-control-plane-12.0.0.mjs

      - name: Verify production release package
        run: node scripts/verify-production-release-12.0.0.mjs

      - name: Upload Build 12.0.0 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptt-build-12.0.0-production-release
          path: artifacts/build-12.0.0
          if-no-files-found: error
          retention-days: 90
