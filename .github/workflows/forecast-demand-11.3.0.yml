name: Build 11.3.0 Forecast and Demand

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast-and-demand:
    name: Forecast calculation and evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Verify known forecast scenarios
        run: node scripts/test-forecast-engine-11.3.0.mjs

      - name: Generate Forecast Validation Lab
        run: node scripts/generate-forecast-workbench-11.3.0.mjs

      - name: Generate forecast evidence
        run: node scripts/forecast-control-plane-11.3.0.mjs

      - name: Verify forecast release contract
        run: node scripts/verify-forecast-11.3.0.mjs

      - name: Upload Build 11.3.0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptt-build-11.3.0-forecast-demand
          path: artifacts/build-11.3.0
          if-no-files-found: error
          retention-days: 30
