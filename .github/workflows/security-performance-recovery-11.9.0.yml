name: Build 11.9.0 Security Performance Recovery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    name: Security, performance, recovery, and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Verify notification/admin baseline
        run: node scripts/test-notification-admin-11.8.0.mjs

      - name: Verify hardening scenarios
        run: node scripts/test-security-performance-recovery-11.9.0.mjs

      - name: Generate hardening validation lab
        run: node scripts/generate-hardening-workbench-11.9.0.mjs

      - name: Generate hardening and release-gate evidence
        run: node scripts/security-performance-recovery-control-plane-11.9.0.mjs

      - name: Verify hardening release contract
        run: node scripts/verify-security-performance-recovery-11.9.0.mjs

      - name: Upload Build 11.9.0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptt-build-11.9.0-hardening
          path: artifacts/build-11.9.0
          if-no-files-found: error
          retention-days: 30
