services:
  - type: web
    name: ptt-smokehouse-control
    env: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && test -s pnpm-lock.yaml && pnpm install --prod=false --frozen-lockfile && pnpm run render-build
    startCommand: pnpm run start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: ptt-smokehouse-control-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_SESSION_TOKEN
        sync: false
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_APPLICATION_SECRET
        sync: false
      - key: SQUARE_REDIRECT_URI
        sync: false
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
      - key: SQUARE_WEBHOOK_NOTIFICATION_URL
        sync: false
      - key: POS_SQUARE_ENV
        value: sandbox
      - key: POS_CRON_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: PTT Smokehouse Control
      - key: BILLING_MODE
        value: MANUAL_INVOICE
      - key: ENFORCE_PRIVILEGED_2FA
        value: "false"
      - key: ARCHER_DEMO_MODE
        value: "false"
      - key: TENANT_GUARD_ENABLED
        value: "1"
      - key: BILLING_CONTACT_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: BACKUP_POST_URL
        sync: false
      - key: BACKUP_APP_URL
        sync: false
      # Build 10.0.0 — compliance, notifications, cost, observability
      - key: APP_BASE_URL
        sync: false
      - key: COMPANY_POSTAL_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        value: support@smokehousecontrol.com
      - key: NOTIFY_FROM_EMAIL
        value: no-reply@smokehousecontrol.com
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_INBOUND_WEBHOOK_URL
        sync: false
      - key: OPS_ALERT_EMAIL
        sync: false
      - key: OPS_TIMEZONE
        value: America/New_York
      - key: AI_DAILY_CENTS_CAP
        value: "200"
      - key: AI_DAILY_ALERT_CENTS
        value: "1000"
      - key: AI_MAX_TOKENS_PER_CONVERSATION
        value: "8000"

  - type: cron
    name: ptt-smokehouse-control-weekly-backup
    env: node
    schedule: "0 8 * * 0"
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && test -s pnpm-lock.yaml && pnpm install --prod=false --frozen-lockfile
    startCommand: pnpm run backup:weekly
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: CRON_SECRET
        sync: false
      - key: BACKUP_APP_URL
        sync: false
      - key: BACKUP_POST_URL
        sync: false

  - type: cron
    name: ptt-smokehouse-control-daily-retention
    env: node
    schedule: "0 7 * * *"
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && test -s pnpm-lock.yaml && pnpm install --prod=false --frozen-lockfile
    startCommand: pnpm run cron:retention
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: CRON_SECRET
        sync: false
      - key: BACKUP_APP_URL
        sync: false
      - key: APP_BASE_URL
        sync: false

  - type: cron
    name: ptt-smokehouse-control-daily-digest
    env: node
    schedule: "0 11 * * 1-5"
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && test -s pnpm-lock.yaml && pnpm install --prod=false --frozen-lockfile
    startCommand: pnpm run cron:daily-digest
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: CRON_SECRET
        sync: false
      - key: BACKUP_APP_URL
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  - name: ptt-smokehouse-control-db
    plan: starter
